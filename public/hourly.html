<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeRun — Hourly Conversion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #E8611A; --blue: #2563EB; --red: #DC2626;
      --muted: #6B7280; --border: #E5E7EB; --bg: #F9FAFB;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: #111827; font-size: 14px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid var(--border); }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .logo-mark { width: 32px; height: 32px; background: var(--orange); border-radius: 8px; color: #fff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .logo-sub { font-size: 11px; font-weight: 400; color: var(--muted); display: block; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .refresh-info { font-size: 12px; color: var(--muted); }
    .refresh-info strong { color: #374151; }

    .btn { padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-primary:hover { background: #CF5516; }

    .main { max-width: 1100px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

    .toolbar { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
    .date-input { padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; }

    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .card-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .card-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .icon-blue { background: #DBEAFE; }
    .icon-dark { background: #1F2937; }
    .card-title { font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: #374151; }

    table { width: 100%; border-collapse: collapse; }
    th { padding: 8px 14px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th:first-child { text-align: left; }
    td { padding: 7px 14px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
    td:first-child { text-align: left; color: var(--muted); font-weight: 500; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg); }

    .cvr { color: var(--orange); font-weight: 700; }
    .val { font-weight: 700; color: #111827; }
    .zero { color: var(--border); }

    .conv-empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }
    .conv-loading { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }
    .spin { display: inline-block; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tfoot-row td { font-weight: 700; font-size: 12px; border-top: 2px solid var(--border); border-bottom: none; background: var(--bg); }
    .tfoot-row td:first-child { color: #374151; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-mark">H</div>
    <div>
      HomeRun
      <span class="logo-sub">Hourly Conversion</span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="refresh-info" id="refreshInfo"><span>–</span></div>
    <a href="/" style="font-size:13px;color:var(--blue);text-decoration:none;font-weight:600;">← Daily Dashboard</a>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <input type="date" id="datePicker" class="date-input">
    <button class="btn btn-primary" id="loadBtn" onclick="loadHourly()">Load</button>
  </div>

  <!-- Web Conversion -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon icon-blue">🌐</div>
      <div class="card-title">Web Conversion — Hourly</div>
    </div>
    <div id="webWrapper">
      <div class="conv-empty">Select a date and click Load</div>
    </div>
  </div>

  <!-- App Conversion -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon icon-dark">📱</div>
      <div class="card-title">App Conversion — Hourly</div>
    </div>
    <div id="appWrapper">
      <div class="conv-empty">Select a date and click Load</div>
    </div>
  </div>
</div>

<script>
  function istYesterday() {
    const d = new Date(Date.now() + 5.5 * 60 * 60 * 1000);
    d.setUTCDate(d.getUTCDate() - 1);
    return d.toISOString().slice(0, 10);
  }

  document.getElementById('datePicker').value = istYesterday();

  function fmtHour(h) {
    if (h === 0)  return '12 AM';
    if (h < 12)  return `${h} AM`;
    if (h === 12) return '12 PM';
    return `${h - 12} PM`;
  }

  function fmtNum(n) {
    if (!n) return '<span class="zero">—</span>';
    return `<span class="val">${n.toLocaleString()}</span>`;
  }

  function fmtCVR(num, den) {
    if (!den) return '<span class="zero">—</span>';
    return `<span class="cvr">${(num / den * 100).toFixed(1)}%</span>`;
  }

  function buildWebTable(rows) {
    const totals = { sessions: 0, productAdded: 0, cartPage: 0, orders: 0 };
    const bodyRows = rows.map(r => {
      totals.sessions     += r.sessions;
      totals.productAdded += r.productAdded;
      totals.cartPage     += r.cartPage;
      totals.orders       += r.orders;
      return `<tr>
        <td>${fmtHour(r.hour)}</td>
        <td>${fmtNum(r.sessions)}</td>
        <td>${fmtNum(r.productAdded)}</td>
        <td>${fmtNum(r.cartPage)}</td>
        <td>${fmtNum(r.orders)}</td>
        <td>${fmtCVR(r.orders, r.sessions)}</td>
      </tr>`;
    }).join('');
    const tfoot = `<tr class="tfoot-row">
      <td>Total</td>
      <td>${totals.sessions.toLocaleString()}</td>
      <td>${totals.productAdded.toLocaleString()}</td>
      <td>${totals.cartPage.toLocaleString()}</td>
      <td>${totals.orders.toLocaleString()}</td>
      <td>${fmtCVR(totals.orders, totals.sessions)}</td>
    </tr>`;
    return `<table>
      <thead><tr>
        <th>Hour</th><th>Web Sessions</th><th>Product Added</th>
        <th>Cart Page</th><th>Orders (Web)</th><th style="color:var(--orange)">CVR</th>
      </tr></thead>
      <tbody>${bodyRows}</tbody>
      <tfoot>${tfoot}</tfoot>
    </table>`;
  }

  function buildAppTable(rows) {
    const totals = { launched: 0, productAdded: 0, cartScreen: 0, orders: 0 };
    const bodyRows = rows.map(r => {
      totals.launched     += r.launched;
      totals.productAdded += r.productAdded;
      totals.cartScreen   += r.cartScreen;
      totals.orders       += r.orders;
      return `<tr>
        <td>${fmtHour(r.hour)}</td>
        <td>${fmtNum(r.launched)}</td>
        <td>${fmtNum(r.productAdded)}</td>
        <td>${fmtNum(r.cartScreen)}</td>
        <td>${fmtNum(r.orders)}</td>
        <td>${fmtCVR(r.orders, r.launched)}</td>
      </tr>`;
    }).join('');
    const tfoot = `<tr class="tfoot-row">
      <td>Total</td>
      <td>${totals.launched.toLocaleString()}</td>
      <td>${totals.productAdded.toLocaleString()}</td>
      <td>${totals.cartScreen.toLocaleString()}</td>
      <td>${totals.orders.toLocaleString()}</td>
      <td>${fmtCVR(totals.orders, totals.launched)}</td>
    </tr>`;
    return `<table>
      <thead><tr>
        <th>Hour</th><th>App Launched</th><th>Product Added</th>
        <th>Cart Screen</th><th>Orders (App)</th><th style="color:var(--orange)">CVR</th>
      </tr></thead>
      <tbody>${bodyRows}</tbody>
      <tfoot>${tfoot}</tfoot>
    </table>`;
  }

  async function loadHourly() {
    const date = document.getElementById('datePicker').value;
    if (!date) return;

    const btn = document.getElementById('loadBtn');
    btn.innerHTML = '<span class="spin">⟳</span>';
    btn.disabled  = true;

    const loading = '<div class="conv-loading"><span class="spin">⟳</span> Loading — this may take a minute…</div>';
    document.getElementById('webWrapper').innerHTML = loading;
    document.getElementById('appWrapper').innerHTML = loading;

    try {
      const res  = await fetch(`/api/hourly-conversion?date=${date}`);
      const json = await res.json();
      if (!json.success) throw new Error(json.error);

      document.getElementById('webWrapper').innerHTML = buildWebTable(json.web);
      document.getElementById('appWrapper').innerHTML = buildAppTable(json.app);

      const now = new Date(Date.now() + 5.5 * 60 * 60 * 1000);
      const t   = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      document.getElementById('refreshInfo').innerHTML = `<strong>Last refreshed</strong> ${t}`;
    } catch (e) {
      const msg = `<div class="conv-empty" style="color:var(--red)">Error: ${e.message}</div>`;
      document.getElementById('webWrapper').innerHTML = msg;
      document.getElementById('appWrapper').innerHTML = msg;
    } finally {
      btn.innerHTML = 'Load';
      btn.disabled  = false;
    }
  }
</script>
</body>
</html>
